
{{-if .Values.networkPolicy.enabled-}}
# todo ingress from kube-apiserver
# todo ingress from gateway
{{-$aiDetails:=(dict) -}}
{{-$otelDetails:=(dict) -}}
{{-$oidcDetails:=(dict) -}}
{{- if .Values.networkPolicy.ai.enabled -}}
{{-$aiDetails:=(fromYaml (include "practice-project.route" .Values.ai.endpoint))-}}
{{-end-}}
{{- if and .Values.otel.enabled .Values.networkPolicy.otel.enabled -}}
{{-$otelDetails=(fromYaml (include "practice-project.route" .Values.otel.endpoint))-}}
{{-end-}}
{{- if and .Values.oidc.enabled .Values.networkPolicy.oidc.enabled -}}
{{-$oidcDetails:=(fromYaml (include "practice-project.route" .Values.oidc.endpoint))-}}
{{-end-}}
{{-if .Values.networkPolicy.defaultDeny -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ print (include "practice-project.fullname" .) "-default-deny" }}
  labels:
    {{- include "practice-project.labels" . | nindent 4 }}
spec:
  description: Default Deny for Practice Project
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  egress: []
  inggress: []
{{-end-}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "practice-project.fullname" . }}
  labels:
    {{- include "practice-project.labels" . | nindent 4 }}
spec:
  description: Pod Firewalls for Practice Projects
  policyTypes:
    - Ingress
    - Egress
  podSelector:
    - matchLabels:
        {{- include "practice-project.labels" . | nindent 8 }}
  ingress:
    - from:
        # K8s API Server
        - podSelector:
            matchLabels:
              k8s-app: kube-apiserver
          namespaceSelector:
            matchLabels:  
              kubernetes.io/metadata.name: kube-system
        {{-if .Values.networkPolicy.konnectivity.enabled-}}
        # Konnectivity
        {{-if empty .Values.networkPolicy.konnectivity.selectors-}}
        - podSelector:
            matchLabels:
              k8s-app: konnectivity-agent
          namespaceSelector:
            matchLabels:  
              kubernetes.io/metadata.name: kube-system
        {{-else-}}
        {{toYaml .Values.networkPolicy.konnectivity.selectors | nident 8}}
        {{-end-}}   
        {{-if and .Values.httpRoute.enabled .Values.networkPolicy.httpRoute.enabled .Values.networkPolicy.httpRoute.selectors-}}
        # HTTPRoute ingress
        {{toYaml .Values.networkPolicy.httpRoute.selectors | nident 8}}
        {{-end-}}   
        {{-if and .Values.udpRoute.enabled .Values.networkPolicy.udpRoute.enabled .Values.networkPolicy.httpRoute.selectors-}}
        # UDPRoute ingress
        {{toYaml .Values.networkPolicy.udpRoute.selectors | nident 8}}
        {{-end-}}
        {{-if and .Values.knative.enabled .Values.networkPolicy.knative.enabled-}}
        # Knative
        {{-if empty .Values.networkPolicy.knative.selectors-}}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: knative
        {{-else-}}
        {{ toYaml .Values.networkPolicy.knative.selectors | nident 8}}
        {{-end-}}
        {{-end-}}
        {{-if .Values.networkPolicy.knative.selectors-}}
        {{ toYaml .Values.networkPolicy.knative.selectors | nident 8}}
        {{-end-}}
      ports:
        - port: "http"
          protocol: TCP
        {{-if .Values.http3-}}
        - port: "http3"
          protocol: UDP
        {{-end-}}
    {{-end-}}
    {{-if and .Values.http3 .Values.udpRoute.enabled .Values.networkPolicy.udpRoute.enabled-}}
    - from:
        {{ toYaml .Values.networkPolicy.udpRoute.selectors | nident 8}}
      ports:
        - port: "http3"
          protocol: UDP
    {{-end-}}
    {{-if and .Values.httpRoute.enabled .Values.networkPolicy.httpRoute.enabled-}}
    - from:
        {{ toYaml .Values.networkPolicy.httpRoute.selectors | nident 8}}
      ports:
        - port: "http"
          protocol: TCP
        {{-if .Values.http3-}}
        # future proofing
        - port: "http3"
          protocol: UDP
        {{-end-}}
    {{-end-}}
  egress:
    {{-if .Values.networkPolicy.dns.enabled-}}
    # Kube DNS
    - to:
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: dns-tcp
        - protocol: UDP
          port: dns
    {{-end-}}
    {{-if $oidcDetails -}}
    # OIDC
    - to:
        {{-if $oidcDetails.ip-}}
        - ipBlock:
            cidr: {{ $oidcDetails.ip | quote}}
        {{-end-}}
        {{-if $oidcDetails.fqdn-}}
        {{- with (fromYaml (include "practice-project.netpol.svcLookup" $oidcDetails.fqdn $.))-}}
        {{ toYaml . | nident 8 }}
        {{- end-}}
        {{-end-}}
        {{-with $.Values.networkPolicy.oidc.selectors-}}
        {{ toYaml . | nident 8 }}
        {{-end-}}
      ports:
        {{-range $oidcDetails.ports-}}
        - protocol: TCP
          port: {{ . }}
        {{- if $.Values.oidc.http3-}}
        - protocol: UDP
          port: {{ . }}
        {{-end-}}
        {{-end-}}
    {{-end-}}
    {{-if $otelDetails -}}
    # OTEL
    - to:
        {{-if $otelDetails.ip-}}
        - ipBlock:
            cidr: {{ $otelDetails.ip | quote}}
        {{-end-}}
        {{-if $otelDetails.fqdn-}}
        {{- with (fromYaml (include "practice-project.netpol.svcLookup" $otelDetails.fqdn $.))-}}
        {{ toYaml . | nident 8 }}
        {{- end-}}
        {{-end-}}
        {{-with $.Values.networkPolicy.otel.selectors-}}
        {{ toYaml . | nident 8 }}
        {{-end-}}
      ports:
        {{-range $otelDetails.ports-}}
        - protocol: TCP
          port: {{ . }}
        {{- if $.Values.otel.http3-}}
        - protocol: UDP
          port: {{ . }}
        {{-end-}}
        {{-end-}}
    {{-end-}}
    {{-if $aiDetails -}}
    # OTEL
    - to:
        {{-if $aiDetails.ip-}}
        - ipBlock:
            cidr: {{ $aiDetails.ip | quote}}
        {{-end-}}
        {{-if $aiDetails.fqdn-}}
        {{- with (fromYaml (include "practice-project.netpol.svcLookup" $aiDetails.fqdn $.))-}}
        {{ toYaml . | nident 8 }}
        {{- end-}}
        {{-end-}}
        {{-with $.Values.networkPolicy.ai.selectors-}}
        {{ toYaml . | nident 8 }}
        {{-end-}}
      ports:
        {{-range $aiDetails.ports-}}
        - protocol: TCP
          port: {{ . }}
        {{- if $.Values.ai.http3-}}
        - protocol: UDP
          port: {{ . }}
        {{-end-}}
        {{-end-}}
    {{-end-}}
{{-end-}}
