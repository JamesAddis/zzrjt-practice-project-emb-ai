{{- if and .Values.http3 .Values.udpRoute.enabled (not .Values.knative.enabled) -}}
{{- $fullName := include "practice-project.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "practice-project.labels" . | nindent 4 }}
  {{- with .Values.udpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.udpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.udpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.udpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        {{-if .Values.keda.enabled-}}
        - name: {{.Values.keda.service | default "keda-add-ons-http-interceptor-proxy" | quote }}
          namespace: {{ .Values.keda.namespace | default "keda" | quote }}
          port: {{ .Values.keda.port | default 8080 }}
          weight: 1
        {{-else-}}
        - name: {{ $fullName }}
          port: {{ $svcPort }}
          weight: 1
        {{-end-}}
    {{- end }}
{{- end }}
