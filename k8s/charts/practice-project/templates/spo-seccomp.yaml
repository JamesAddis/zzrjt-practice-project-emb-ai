{{-if and .Values.spo.enabled .Values.spo.seccomp.create-}}
---
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: SeccompProfile
metadata:
  name: {{ include "practice-project.seccompName" . }}
  labels:
    {{- include "practice-project.labels" . | nindent 4 }}
spec:
  {{-with .Values.spo.seccomp-}}
  defaultAction: {{ .defaultAction | default "SCMP_ACT_LOG" | quote }}
  {{with .architectures}}
  architectures:
    {{ toYaml . | nindent 4}}
  {{-end-}}
  syscalls:
  {{with .syscalls}}
    {{ toYaml . | nindent 4}}
  {{-end-}}
  {{-end-}}
{{-end-}}