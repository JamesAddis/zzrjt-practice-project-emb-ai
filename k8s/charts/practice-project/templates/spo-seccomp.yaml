{{-if and .Values.spo.enabled .Values.spo.seccomp.create-}}
---
apiVersion: security-profiles-operator.x-k8s.io/v1
kind: SeccompProfile
metadata:
  name: {{ include "practice-project.fullname" . }}
  labels:
    {{- include "practice-project.labels" . | nindent 4 }}
spec:
  defaultAction: {{ .Values.spo.seccomp.defaultAction | default "SCMP_ACT_LOG" | quote }}
{{-end-}}