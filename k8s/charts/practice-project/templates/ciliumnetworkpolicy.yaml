{{-if and .Values.cilium.enabled .Values.cilium.networkPolicy.enabled-}}
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "practice-project.fullname" . }}
  labels:
    {{- include "practice-project.labels" . | nindent 4 }}
{{-$aiDetails:=(fromYaml (include "practice-project.route" .Values.ai.endpoint))-}}
{{-$otelDetails:=(dict) -}}
{{-$oidcDetails:=(dict) -}}
{{- if and .Values.otel.enabled .Values.cilium.networkPolicy.otel -}}
{{-$otelDetails=(fromYaml (include "practice-project.route" .Values.otel.endpoint))-}}
{{-end-}}
{{- if and .Values.oidc.enabled .Values.cilium.networkPolicy.oidc -}}
{{-$oidcDetails:=(fromYaml (include "practice-project.route" .Values.oidc.endpoint))-}}
{{-end-}}
specs:
  - description: Allow Pod ingress access for Health checks
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    {{-if .Values.cilium.networkPolicy.defaultDeny-}}
    defaultDeny:
      ingress: true
      egress: true
    {{-end-}}
    ingress:
      - fromEntities:
          - health
          - kube-apiserver
        toPorts:
          - ports:
              - port: "http"
                protocol: TCP
              {{-if .Values.http3-}}
              - port: "http3"
                protocol: UDP
              {{-end-}}
            rules:
              http:
                - method: GET
                  path: /healthz
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: konnectivity-agent
        toPorts:
          - ports:
              - port: "http"
                protocol: TCP
              {{-if .Values.http3-}}
              - port: "http3"
                protocol: UDP
              {{-end-}}
            rules:
              http:
                - method: GET
                  path: /healthz
  {{-if and .Values.keda.enabled .Values.cilium.networkPolicy.keda.enabled -}}
  - description: Allow Pod ingress for KEDA
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    ingress:
      - fromEndpoints:
          {{ toYaml .Values.cilium.networkPolicy.keda.selectors | nident 10}}
        toPorts:
          - ports:
              - port: "http"
                protocol: TCP
              {{-if  $.Values.http3-}}
              - port: "http3"
                protocol: UDP
              {{-end-}}
            rules:
              http: [{}]
  {{-end-}}
  {{-if and .Values.knative.enabled .Values.cilium.networkPolicy.knative.enabled -}}
  - description: Allow Pod ingress for Knative
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    ingress:
      - fromEndpoints:
          {{ toYaml .Values.cilium.networkPolicy.knative.selectors | nident 10}}
        toPorts:
          - ports:
              - port: "http"
                protocol: TCP
              {{-if  $.Values.http3-}}
              - port: "http3"
                protocol: UDP
              {{-end-}}
            rules:
              http: [{}]
  {{-end-}}
  {{-if and .Values.httpRoute.enabled .Values.cilium.networkPolicy.httpRoute-}}
  - description: Allow Pod ingress for HTTPRoute
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    ingress:
      - fromEndpoints:
          {{ toYaml .Values.cilium.networkPolicy.httpRoute.selectors | nident 10}}
        toPorts:
          - ports:
              - port: "http"
                protocol: TCP
              {{-if  $.Values.http3-}}
              - port: "http3"
                protocol: UDP
              {{-end-}}
            rules:
              http: [{}]
  {{-end-}}
  {{-if and .Values.http3 .Values.udpRoute.enabled .Values.cilium.networkPolicy.udpRoute-}}
  - description: Allow Pod ingress for UDPRoute
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    ingress:
      - fromEndpoints:
          {{ toYaml .Values.cilium.networkPolicy.udpRoute.selectors | nident 10}}
        toPorts:
          - ports:
              - port: "http3"
                protocol: UDP
  {{-end-}}
  {{-if .Values.cilium.networkPolicy.dns -}}
  - description: Allow Pod egress to Kube-DNS for DNS requests
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "dns"
                protocol: TCP
              - port: "dns-udp"
                protocol: UDP
            rules:
              dns:
                {{-if $aiDetails.fqdn -}}
                - matchName: {{ $aiDetails.fqdn | quote}}
                {{-end-}}
                {{-if $otelDetails.fqdn -}}
                - matchName: {{ $otelDetails.fqdn | quote}}
                {{-end-}}
                {{-if $oidcDetails.fqdn-}}
                - matchName: {{ $oidcDetails.fqdn | quote}}
                {{-end-}}
                {{-range .Values.cilium.networkPolicy.dns.patterns -}}
                - matchPattern: {{ . | quote}}
                {{-end-}}
  {{-end-}}
  {{-if .Values.cilium.networkPolicy.ai-}}
  - description: Allow Pod egress to AI Endpoint
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    egress:
      {{-if $aiDetails.ip-}}
      - toCIDRs:
          - {{ $aiDetails.ip| quote}}
        toPorts:
          - ports:
              {{-range $aiDetails.ports-}}
              - port: {{. | quote}}
                protocol: TCP
              {{- if $.Values.ai.http3-}}
              - port: {{. | quote}}
                protocol: UDP
              {{-end-}}
              {{-end-}}
            rules:
              http:
              {{-if or (empty $aiDetails.path) (eq $aiDetails.path "/") -}}
                - {}
              {{-else-}}
                - path: {{$aiDetails.path}}
              {{-end-}}
      {{-end-}}
      {{-if $aiDetails.fqdn-}}
      - toFQDNs:
          - matchName: {{$aiDetails.fqdn | quote}}
        toPorts:
          - ports:
              {{-range $aiDetails.ports-}}
              - port: {{. | quote}}
                protocol: TCP
              {{- if $.Values.ai.http3-}}
              - port: {{. | quote}}
                protocol: UDP
              {{-end-}}
              {{-end-}}
            serverNames:
              - {{ $aiDetails.fqdn | quote}}
            rules:
              http:
              {{-if or (empty $aiDetails.path) (eq $aiDetails.path "/") -}}
                - {}
              {{-else-}}
                - path: {{$aiDetails.path}}
              {{-end-}}
      {{-end-}}
  {{-end-}}
  {{-if $otelDetails-}}
  - description: Pod egress to OTEL Endpoint
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    egress:
      {{-if  $otelDetails.ip -}}
      - toCIDRs:
          - {{ $otelDetails.ip | quote}}
        toPorts:
          - ports:
              {{-range $otelDetails.ports-}}
              - port: {{. | quote}}
                protocol: TCP
              {{- if $.Values.otel.http3-}}
              - port: {{. | quote}}
                protocol: UDP
              {{-end-}}
              {{-end-}}
            rules:
              http:
              {{-if or (empty $otelDetails.path) (eq $otelDetails.path "/") -}}
                - {}
              {{-else-}}
                - path: {{$otelDetails.path}}
              {{-end-}}
      {{-end-}}
      {{-if  $otelDetails.fqdn -}}
      - toFQDNs:
          - matchName: {{$otelDetails.fqdn | quote}}
        toPorts:
          - ports:
              {{-range $otelDetails.ports-}}
              - port: {{. | quote}}
                protocol: TCP
              {{- if $.Values.otel.http3-}}
              - port: {{. | quote}}
                protocol: UDP
              {{-end-}}
              {{-end-}}
            serverNames:
              - {{ $otelDetails.fqdn | quote}}
            rules:
              http:
              {{-if or (empty $otelDetails.path) (eq $otelDetails.path "/") -}}
                - method: POST
              {{-elseGET-}}
                - path: {{$otelDetails.path}}
                  method: POST
              {{-end-}}
  {{-end-}}
  {{-if .Values.cilium.networkPolicy.oidc-}}
  - description: Pod egress to OIDC Endpoint
    endpointSelector:
      matchLabels:
        {{ toYaml include "practice-project.cilium.selector" . | nident 8 }}
    egress:
      {{-if  $oidcDetails.ip -}}
      - toCIDRs:
          - {{ $oidcDetails.ip | quote}}
        toPorts:
          - ports:
              {{-range $oidcDetails.ports-}}
              - port: {{. | quote}}
                protocol: TCP
              {{- if $.Values.oidc.http3-}}
              - port: {{. | quote}}
                protocol: UDP
              {{-end-}}
              {{-end-}}
            rules:
              http:
              {{-if or (empty $oidcDetails.path) (eq $oidcDetails.path "/") -}}
                - {}
              {{-else-}}
                - path: {{print $oidcDetails.path | quote }}
                - path: {{print $oidcDetails.path "/*" | quote}}
              {{-end-}}
      {{-end-}}
      {{-if  $oidcDetails.fqdn -}}
      - toFQDNs:
          - matchName: {{$oidcDetails.fqdn | quote}}
        toPorts:
          - ports:
              {{-range $oidcDetails.ports-}}
              - port: {{. | quote}}
                protocol: TCP
              {{- if $.Values.oidc.http3-}}
              - port: {{. | quote}}
                protocol: UDP
              {{-end-}}
              {{-end-}}
            serverNames:
              - {{ $oidDetails.fqdn | quote}}
            rules:
              http:
              {{-if or (empty $oidcDetails.path) (eq $oidcDetails.path "/") -}}
                - {}
              {{-else-}}
                - path: {{print $oidcDetails.path | quote }}
                - path: {{print $oidcDetails.path "/*" | quote}}
              {{-end-}}
  {{-end-}}
  {{-end-}}
{{-end-}}