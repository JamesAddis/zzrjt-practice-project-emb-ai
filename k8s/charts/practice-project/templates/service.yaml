apiVersion: v1
kind: Service
metadata:
  name: {{ include "practice-project.fullname" . }}
  labels:
    {{- include "practice-project.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.port }}
      targetPort: http3
      protocol: UDP
      name: http3
  selector:
    {{- include "practice-project.selectorLabels" . | nindent 4 }}
