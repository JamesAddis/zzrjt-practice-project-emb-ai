suite: test httproute KEDA setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/httproute.yaml
set:
  httpRoute.enabled: true
  autoscaling.enabled: true
  keda.enabled: true
  knative.enabled: false
tests:
  - it: should use KEDA custom http add on service instead of native service
    set:
      service.port: 8443
      keda.service: "custom-keda-service"
      keda.namespace: "keda-alt"
      keda.port: 9090
    asserts:
      - isKind:
          of: HTTPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
      - notContains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "my-release"
                  port: 8443
                  weight: 1
          any: true
      - notContains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "keda-add-ons-http-interceptor-proxy"
                  namespace: "keda"
                  port: 8080
                  weight: 1
          any: true
      - contains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "custom-keda-service"
                  namespace: "keda-alt"
                  port: 9090
                  weight: 1
          any: true
  - it: should use KEDA http add on service instead of native service
    set:
      service.port: 5656
      keda.service: ""
      keda.namespace: ""
      keda.port: ""
    asserts:
      - notContains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "my-release"
                  port: 5656
                  weight: 1
          any: true
      - contains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "keda-add-ons-http-interceptor-proxy"
                  namespace: "keda"
                  port: 8080
                  weight: 1
          any: true