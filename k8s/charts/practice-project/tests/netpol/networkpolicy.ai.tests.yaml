suite: test Networkpolicy allows egress to AI
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  newtworkPolicy.enabled: true
  newtworkPolicy.ai.enabled: true
tests:
  - it: should not setup egress to AI if not enabled
    set:
      ai.endpoint: 10.10.1.2
      ai.http3: true
      newtworkPolicy.ai.enabled: false
      networkPolicy.ai.selectors:
        - podSelector:
            matchLabels:
              test: app
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
              - podSelector:
                  matchLabels:
                    test: app
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: true
  - it: should setup egress to AI CIDR without http3 support and no selectors
    set:
      ai.endpoint: 10.10.1.2
      ai.http3: false
      networkPolicy.ai.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
          count: 1
          any: false
  
  - it: should setup egress to AI CIDR with http3 support
    set:
      ai.endpoint: 10.10.1.2
      ai.http3: true
      networkPolicy.ai.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to AI CIDR with http3 support
    set:
      ai.endpoint: http://10.100.255.255
      ai.http3: true
      networkPolicy.ai.enabled: true
      networkPolicy.ai.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.100.255.255
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.100.255.255
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to AI CIDR with http3 support
    set:
      ai.endpoint: https://192.168.100.15
      ai.http3: true
      networkPolicy.ai.enabled: true
      networkPolicy.ai.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
            ports:
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to AI CIDR with http3 support
    set:
      ai.endpoint: https://192.168.100.15:6798/prefix
      ai.http3: true
      networkPolicy.ai.enabled: true
      networkPolicy.ai.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
            ports:
              - port: 6798
                protocol: TCP
              - port: 6798
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to AI CIDR with http3 support
    set:
      ai.endpoint: https://192.168.100.15:6798/prefix
      ai.http3: true
      networkPolicy.ai.enabled: true
      networkPolicy.ai.selectors:
        - podSelector:
            matchLabels:
              test: app
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
              - podSelector:
                  matchLabels:
                    test: app
            ports:
              - port: 6798
                protocol: TCP
              - port: 6798
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to AI FQDN with http3 support and selectors
    set:
      ai.endpoint: http://tester.test:9444/prefix
      ai.http3: true
      networkPolicy.ai.enabled: true
      networkPolicy.ai.selectors:
        - podSelector:
            matchLabels:
              test: app
        - namespaceSelector:
            matchLabels:
              bacon: tempation
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
              - namespaceSelector:
                  matchLabels:
                    bacon: tempation
            ports:
              - port: 9444
                protocol: TCP
              - port: 9444
                protocol: UDP
          count: 1
          any: false
  