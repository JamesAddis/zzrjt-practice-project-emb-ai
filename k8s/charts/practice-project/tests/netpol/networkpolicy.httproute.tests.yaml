suite: test Networkpolicy allows ingress from HTTPRoute
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  networkPolicy.enabled: true
tests:
  - it: should not setup ingress from httpRoute if not enabled
    set:
      http3: false
      httpRoute.enabled: false
      networkPolicy.httpRoute.enabled: true
      networkPolicy.httpRoute.selectors:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
            ports:
              - port: "http"
                protocol: TCP
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
            ports:
              - port: "http"
                protocol: TCP
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
  - it: should not setup ingress from httpRoute if not enabled for network policy
    set:
      http3: true
      httpRoute.enabled: true
      networkPolicy.httpRoute.enabled: false
      networkPolicy.httpRoute.selectors:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: another-one
          podSelector:
            matchExpressions:
              - key: "testing"
                operator: Exists
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: another-one
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: another-one
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
            ports:
              - port: "http"
                protocol: TCP
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: another-one
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
            ports:
              - port: "http"
                protocol: TCP
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
  - it: should setup ingress from httpRoute if enabled with http3
    set:
      http3: true
      httpRoute.enabled: true
      networkPolicy.httpRoute.enabled: true
      networkPolicy.httpRoute.selectors:
        - namespaceSelector:
            matchExpressions:
              - key: "welcome"
                operator: In
                values:
                  - value1
                  - value2
          podSelector:
            matchExpressions:
              - key: "testing"
                operator: Exists
    asserts:
      - isKind:
          of: NetworkPolicy
      - isSome:
          path: spec
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchExpressions:
                    - key: "welcome"
                      operator: In
                      values:
                        - value1
                        - value2
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
          count: 1
          any: true
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchExpressions:
                    - key: "welcome"
                      operator: In
                      values:
                        - value1
                        - value2
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
            ports:
              - port: "http"
                protocol: TCP
          count: 1
          any: true
      - contains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchExpressions:
                    - key: "welcome"
                      operator: In
                      values:
                        - value1
                        - value2
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
            ports:
              - port: "http"
                protocol: TCP
              - port: "http3"
                protocol: UDP
          count: 1
          any: false
  - it: should setup ingress from httpRoute if enabled without http3
    set:
      http3: false
      httpRoute.enabled: true
      networkPolicy.httpRoute.enabled: true
      networkPolicy.httpRoute.selectors:
        - podSelector:
            matchLabels:
              gateway: http
        - namespaceSelector:
            matchLabels:
              testing: testing
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    gateway: http
                namespaceSelector:
                  matchLabels:
                    testing: testing
          count: 1
          any: true
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    gateway: http
                namespaceSelector:
                  matchLabels:
                    testing: testing
            ports:
              - port: "http"
                protocol: TCP
          count: 1
          any: true
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    gateway: http
                namespaceSelector:
                  matchLabels:
                    testing: testing
            ports:
              - port: "http"
                protocol: TCP
          count: 1
          any: true