suite: test Networkpolicy allows egress to DNS
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  newtworkPolicy.enabled: true
tests:
  - it: should not setup egress to DNS if not enabled
    set:
      newtworkPolicy.dns.enabled: false
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    k8s-app: kube-dns
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    k8s-app: kube-dns
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - protocol: TCP
                port: dns-tcp
              - protocol: UDP
                port: dns-udp
          count: 1
          any: false
  - it: should setup egress to DNS if enabled
    set:
      newtworkPolicy.dns.enabled: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    k8s-app: kube-dns
                namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: kube-system
            ports:
              - protocol: TCP
                port: dns-tcp
              - protocol: UDP
                port: dns-udp
          count: 1
          any: false
