suite: test OTEL Networkpolicy
templates:
  - otel-networkpolicy.yaml
tests:
  - it: should setup egress to dns request server with AI fqdn
    set:
      globals.cilium.enabled: true
      ai.endpoint: test.ai.example.internal
    asserts:
      - isKind:
          of: NetworkPolicy
      - matchRegex:
          path: specs
          pattern: -my-chart$
      - equal:
          path: egress[0].rules[*].ports[0].rules.dns[*]
          value: test.ai.example.internal
  
  - it: should setup egress to ai FQDN endpoint
    set:
      networkpolicy.otel.enabled: true
      otel.endpoint: test.ai.example.internal
    asserts:
      - isKind:
          of: mNetworkPolicy
      - matchRegex:
          path: specs
          pattern: -my-chart$
      - equal:
          path: egress[0].rules[@_.toFQDNs[*].matchName == "test.ai.example.internal"]
          value: test.ai.example.internal
      - equal:
          path: egress[0].rules[@_.toFQDNs[*].matchName == "test.ai.example.internal"].ports[*].ports
          value: test.ai.example.internal
  
  - it: should setup egress to dns request server with AI fqdn
    set:
      globals.cilium.enabled: true
      ai.endpoint: different.ai.example.lan
    asserts:
      - isKind:
          of: NetworkPolicy
      - matchRegex:
          path: specs
          pattern: -my-chart$
      - equal:
          path: egress[0].rules[*].ports[0].rules.dns[*]
          value: nginx:tester
  - it: should use digest
    set:
      image.tag: tester
      image.digest: sha256:e2fd96aab9f74037ccbf7200f9512b02a999d47331acb8a23aee034a7abc4c3b
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx@sha256:e2fd96aab9f74037ccbf7200f9512b02a999d47331acb8a23aee034a7abc4c3b
  - it: should add apparmor profile set to use
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should add apparmor profile set to create apparmor
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should add seccomp profile set to use
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should add seccomp profile set to create
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should set filesystem as readonly if hardened
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should create empty dirs for for /var/logs, tmp, and /var/lib
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should create /etc/practice-project as projected volume with read only options
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest