suite: test Networkpolicy allows ingress from kube-apiserver and konnectivity
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  newtworkPolicy.enabled: true
  newtworkPolicy.konnectivity.enabled: true
tests:
  - it: should not setup ingress from konnectivity if not enabled
    set:
      newtworkPolicy.konnectivity.enabled: false
      http3: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    k8s-app: kube-apiserver
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: "http"
                protocol: TCP
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    k8s-app: konnectivity-agent
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    k8s-app: kube-apiserver
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
              - podSelector:
                  matchLabels:
                    k8s-app: konnectivity-agent
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
          count: 1
          any: true
  - it: should setup ingress from konnectivity if enabled
    set:
      newtworkPolicy.konnectivity.enabled: true
      http3: true
    asserts:
      - isKind:
          of: NetworkPolicy
      - isSome:
          path: spec
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    k8s-app: kube-apiserver
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
              - podSelector:
                  matchLabels:
                    k8s-app: konnectivity-agent
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: "http"
                protocol: TCP
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
  - it: should setup ingress from konnectivity if enabled and http3 not enabled
    set:
      newtworkPolicy.konnectivity.enabled: true
      http3: false
    asserts:
      - isKind:
          of: NetworkPolicy
      - isSome:
          path: spec
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    k8s-app: kube-apiserver
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
              - podSelector:
                  matchLabels:
                    k8s-app: konnectivity-agent
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: kube-system
            ports:
              - port: "http"
                protocol: TCP
          count: 1
          any: true
  