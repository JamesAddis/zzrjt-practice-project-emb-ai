suite: test Networkpolicy allows egress to OIDC
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  newtworkPolicy.enabled: true
  newtworkPolicy.oidc.enabled: true
tests:
  - it: should not setup egress to OIDC if not enabled
    set:
      oidc.endpoint: 10.10.1.2
      oidc.http3: true
      newtworkPolicy.oidc.enabled: false
      networkPolicy.oidc.selectors:
        - podSelector:
            matchLabels:
              test: app
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
              - podSelector:
                  matchLabels:
                    test: app
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: true
  - it: should setup egress to OIDC CIDR without http3 support and no selectors
    set:
      oidc.endpoint: 10.10.1.2
      oidc.http3: false
      networkPolicy.oidc.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
          count: 1
          any: false
  
  - it: should setup egress to OIDC CIDR with http3 support
    set:
      oidc.endpoint: 10.10.1.2
      oidc.http3: true
      networkPolicy.oidc.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to OIDC CIDR with http3 support
    set:
      oidc.endpoint: http://10.100.255.255
      oidc.http3: true
      networkPolicy.oidc.enabled: true
      networkPolicy.oidc.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.100.255.255
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.100.255.255
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OIDC CIDR with http3 support
    set:
      oidc.endpoint: https://192.168.100.15
      oidc.http3: true
      networkPolicy.oidc.enabled: true
      networkPolicy.oidc.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
            ports:
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OIDC CIDR with http3 support
    set:
      oidc.endpoint: https://192.168.100.15:6798/prefix
      oidc.http3: true
      networkPolicy.oidc.enabled: true
      networkPolicy.oidc.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
            ports:
              - port: 6798
                protocol: TCP
              - port: 6798
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OIDC CIDR with http3 support
    set:
      oidc.endpoint: https://192.168.100.15:6798/prefix
      oidc.http3: true
      networkPolicy.oidc.enabled: true
      networkPolicy.oidc.selectors:
        - podSelector:
            matchLabels:
              test: app
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
              - podSelector:
                  matchLabels:
                    test: app
            ports:
              - port: 6798
                protocol: TCP
              - port: 6798
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to OIDC FQDN with http3 support and selectors
    set:
      oidc.endpoint: http://tester.test:9444/prefix
      oidc.http3: true
      networkPolicy.oidc.enabled: true
      networkPolicy.oidc.selectors:
        - podSelector:
            matchLabels:
              test: app
        - namespaceSelector:
            matchLabels:
              bacon: tempation
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
              - namespaceSelector:
                  matchLabels:
                    bacon: tempation
            ports:
              - port: 9444
                protocol: TCP
              - port: 9444
                protocol: UDP
          count: 1
          any: false
  