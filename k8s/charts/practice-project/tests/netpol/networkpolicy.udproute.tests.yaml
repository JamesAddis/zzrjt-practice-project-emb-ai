suite: test Networkpolicy allows ingress from UDPRoute for HTTP3
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  networkPolicy.enabled: true
tests:
  - it: should not setup ingress from udpRoute if http3 not enabled
    set:
      http3: false
      udpRoute.enabled: true
      networkPolicy.udpRoute.enabled: true
      networkPolicy.udpRoute.selectors:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
            ports:
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
            ports:
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
  - it: should not setup ingress from udpRoute if not enabled
    set:
      http3: true
      udpRoute.enabled: false
      networkPolicy.udpRoute.enabled: true
      networkPolicy.udpRoute.selectors:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
            ports:
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: envoy-gateway
            ports:
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
  - it: should not setup ingress from udpRoute if not enabled for network policy
    set:
      http3: true
      udpRoute.enabled: true
      networkPolicy.udpRoute.enabled: false
      networkPolicy.udpRoute.selectors:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: another-one
          podSelector:
            matchExpressions:
              - key: "testing"
                operator: Exists
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: another-one
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: another-one
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
            ports:
              - port: "http"
                protocol: TCP
          count: 1
          any: true
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: another-one
                podSelector:
                  matchExpressions:
                    - key: "testing"
                      operator: Exists
            ports:
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
  - it: should setup ingress from udpRoute if enabled
    set:
      http3: true
      udpRoute.enabled: true
      networkPolicy.udpRoute.enabled: true
      networkPolicy.udpRoute.selectors:
        - podSelector:
            matchLabels:
              gateway: udpRoute
        - namespaceSelector:
            matchLabels:
              testing: testing
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    gateway: udpRoute
                namespaceSelector:
                  matchLabels:
                    testing: testing
          count: 1
          any: true
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    gateway: udpRoute
                namespaceSelector:
                  matchLabels:
                    testing: testing
            ports:
              - port: "http3"
                protocol: UDP
          count: 1
          any: true
      - contains:
          path: spec.ingress
          content:
            from:
              - podSelector:
                  matchLabels:
                    gateway: udpRoute
                namespaceSelector:
                  matchLabels:
                    testing: testing
            ports:
              - port: "http3"
                protocol: UDP
          count: 1
          any: true