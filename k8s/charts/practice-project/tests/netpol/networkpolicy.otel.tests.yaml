# TODO decide if I should do service externalname lookup
suite: test Networkpolicy allows egress to OTEL
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  networkPolicy.enabled: true
  networkPolicy.otel.enabled: true
kubernetesProvider:
  schema:
    "v1/service":
      gvr:
        version:  "v1"
        resource: "services"
      namespaced: true
  objects:
    - kind: Service
      apiVersion: v1
      metadata:
        name: test
        namespace: example
      spec:
        selector:
          app.kubernetes.io/name: special-pods
        ports:
          - name: http
            protocol: TCP
            port: 80
            targetPort: 1234
    - kind: Service
      apiVersion: v1
      metadata:
        name: another
        namespace: space
      spec:
        selector:
          exalted: pork
        ports:
          - name: http
            protocol: TCP
            port: 80
            targetPort: 9376
          - name: http3
            protocol: UDP
            port: 80
            targetPort: 9376
          - name: https3
            protocol: UDP
            port: 443
            targetPort: 9377
          - name: https
            protocol: TCP
            port: 443
            targetPort: 9377
    - kind: Service
      apiVersion: v1
      metadata:
        name: local
        namespace: my-namespace
      spec:
        selector:
          final: destination
          regular: testing
        ports:
          - name: http
            protocol: TCP
            port: 80
            targetPort: 4444
          - name: https
            protocol: TCP
            port: 443
            targetPort: 4445
      
tests:
  - it: should not setup egress to OTEL if not enabled
    set:
      otel.endpoint: 10.10.1.2
      otel.http3: true
      networkPolicy.otel.enabled: false
      networkPolicy.otel.selectors:
        - podSelector:
            matchLabels:
              test: app
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - notContains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
              - podSelector:
                  matchLabels:
                    test: app
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: true
  - it: should setup egress to OTEL CIDR without http3 support and no selectors
    set:
      otel.endpoint: 10.10.1.2
      otel.http3: false
      networkPolicy.otel.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 443
                protocol: TCP
          count: 1
          any: false
  
  - it: should setup egress to OTEL CIDR with http3 support
    set:
      otel.endpoint: 10.10.1.2
      otel.http3: true
      networkPolicy.otel.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.10.1.2
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to OTEL CIDR with http3 support
    set:
      otel.endpoint: http://10.100.255.255
      otel.http3: true
      networkPolicy.otel.enabled: true
      networkPolicy.otel.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.100.255.255
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 10.100.255.255
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OTEL CIDR with http3 support
    set:
      otel.endpoint: https://192.168.100.15
      otel.http3: true
      networkPolicy.otel.enabled: true
      networkPolicy.otel.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
            ports:
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OTEL CIDR with http3 support
    set:
      otel.endpoint: https://192.168.100.15:6798/prefix
      otel.http3: true
      networkPolicy.otel.enabled: true
      networkPolicy.otel.selectors: []
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
            ports:
              - port: 6798
                protocol: TCP
              - port: 6798
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OTEL CIDR with http3 support
    set:
      otel.endpoint: https://192.168.100.15:6798/prefix
      otel.http3: true
      networkPolicy.otel.enabled: true
      networkPolicy.otel.selectors:
        - podSelector:
            matchLabels:
              test: app
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - ipBlock:
                  cidr: 192.168.100.15
              - podSelector:
                  matchLabels:
                    test: app
            ports:
              - port: 6798
                protocol: TCP
              - port: 6798
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to OTEL FQDN with http3 support and selectors
    set:
      otel.endpoint: http://tester.test:9444/prefix
      otel.http3: true
      networkPolicy.otel.enabled: true
      networkPolicy.otel.selectors:
        - podSelector:
            matchLabels:
              test: app
        - namespaceSelector:
            matchLabels:
              bacon: tempation
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    test: app
              - namespaceSelector:
                  matchLabels:
                    bacon: tempation
            ports:
              - port: 9444
                protocol: TCP
              - port: 9444
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OTEL FQDN (matches full svc domain) with http3 support
    set:
      otel.endpoint: test.example.svc.cluster.local
      otel.http3: true
      networkPolicy.otel.selectors: []
      global:
        clusterDomain: "cluster.local"
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: special-pods
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: example
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    app.kubernetes.io/name: special-pods
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: example
            ports:
              - port: 80
                protocol: TCP
              - port: 80
                protocol: UDP
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to OTEL FQDN (matches shorthand svc) with http3 support
    set:
      otel.endpoint: https://another.space
      otel.http3: true
      networkPolicy.otel.selectors: []
      global:
        clusterDomain: "cluster.local"
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    exalted: pork
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: space
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    exalted: pork
                namespaceSelector:
                  matchLabels:  
                    kubernetes.io/metadata.name: space
            ports:
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  - it: should setup egress to OTEL FQDN (matches local namespace shorthand svc) with http3 support
    set:
      otel.endpoint: https://local
      otel.http3: true
      networkPolicy.otel.selectors: []
      global:
        clusterDomain: "cluster.local"
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    final: destination
                    regular: testing
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    final: destination
                    regular: testing
            ports:
              - port: 443
                protocol: TCP
              - port: 443
                protocol: UDP
          count: 1
          any: false
  
  - it: should setup egress to OTEL FQDN (matches svc regex) without http3 support
    set:
      otel.endpoint: https://local.my-namespace.svc.another-domain-entirely.internal:3412/bother/bother
      otel.http3: false
      networkPolicy.otel.selectors: []
      global:
        clusterDomain: "another-domain-entirely.internal"
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
      - isSome:
          path: spec.egress
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    final: destination
                    regular: testing
          count: 1
          any: true
      - contains:
          path: spec.egress
          content:
            to:
              - podSelector:
                  matchLabels:
                    final: destination
                    regular: testing
            ports:
              - port: 3412
                protocol: TCP
          count: 1
          any: false
  