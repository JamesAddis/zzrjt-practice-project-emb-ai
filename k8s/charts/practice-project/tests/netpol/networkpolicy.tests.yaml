suite: test Networkpolicy basics
templates:
  - templates/_helper.tpl
  - templates/networkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  networkPolicy.enabled: true
  networkPolicy.otel.enabled: true
tests:
  - it: should not setup network policy if not enabled
    set:
      networkPolicy.enabled: false
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
  - it: should setup network policy if enabled
    set:
      networkPolicy.enabled: false
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec
  - it: should setup 2 network policies if default deny enabled
    set:
      networkPolicy.enabled: false
    asserts:
      - isKind:
          of: NetworkPolicy
      - isNotNull:
          path: spec