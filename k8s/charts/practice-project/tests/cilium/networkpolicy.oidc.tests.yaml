suite: test Host firewall CiliumNetworkpolicy includes egress to oidc services
templates:
  - templates/_helper.tpl
  - templates/ciliumnetworkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  cilium.enabled: true
  cilium.networkPolicy.enabled: true
  cilium.httpRoute.enabled: true
  oidc.enabled: true
  cilium.networkPolicy.oidc.enabled: true
tests:
  - it: should setup egress to oidc FQDN endpoint 
    set:
      oidc.endpoint: test.oidc.lan
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.oidc.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.oidc.lan"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                rules:
                  http: [{}]
              - ports:
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
                serverNames:
                  - "test.oidc.lan"
                rules:
                  http: [{}]
          count: 1
          any: false

  - it: should setup egress to oidc FQDN endpoint with prefix
    set:
      oidc.endpoint: test.oidc.lan/openoidc
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.oidc.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.oidc.lan"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                rules:
                  http:
                    - path: /openoidc
                    - path: /openoidc/*
              - ports:
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
                serverNames:
                  - "test.oidc.lan"
                rules:
                  http:
                    - path: /openoidc
                    - path: /openoidc/*
          count: 1
          any: false

