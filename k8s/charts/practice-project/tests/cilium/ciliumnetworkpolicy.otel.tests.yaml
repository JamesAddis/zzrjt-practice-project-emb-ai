suite: test Host firewall CiliumNetworkpolicy includes egress to oidc services
templates:
  - templates/_helper.tpl
  - templates/ciliumnetworkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set:
  otel.enabled: true
  oidc.enabled: false
  cilium.enabled: true
  cilium.networkPolicy.enabled: true
  cilium.networkPolicy.ai: false
  cilium.networkPolicy.otel: true
  cilium.networkPolicy.oidc: false
tests:
  - it: should setup egress to otel FQDN endpoint 
    set:
      otel.endpoint: test.otel.lan
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                rules:
                  http: [{}]
              - ports:
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
                serverNames:
                  - "test.otel.lan"
                rules:
                  http: [{}]
          count: 1
          any: false

  - it: should setup egress to otel FQDN endpoint with prefix
    set:
      otel.endpoint: test.otel.lan/openotel
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                rules:
                  http:
                    - path: /openotel
                    - path: /openotel/*
              - ports:
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
                serverNames:
                  - "test.otel.lan"
                rules:
                  http:
                    - path: /openotel
                    - path: /openotel/*
          count: 1
          any: false

