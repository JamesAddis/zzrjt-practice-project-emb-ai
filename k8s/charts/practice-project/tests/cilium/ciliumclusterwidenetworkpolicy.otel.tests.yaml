  - it: should setup egress to otel https CIDR endpoint
    set:
      otel.endpoint: https://172.16.20.20
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "172.16.20.20"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "172.16.20.20"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
          count: 1
          any: false
  
  - it: should setup egress to otel with custom port CIDR endpoint
    set:
      otel.endpoint: 192.168.100.42:4545
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              -  192.168.100.42
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              -  192.168.100.42
            toPorts:
              - ports:
                  - port: "4545"
                    protocol: "TCP"
                  - port: "4545"
                    protocol: "UDP"
          count: 1
          any: false
  
  - it: should setup egress to otel with http custom port CIDR endpoint (test.otel.example.internal)
    set:
      otel.endpoint: http://10.250.23.23:6666
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "10.250.23.23"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "10.100.1.1"
            toPorts:
              - ports:
                  - port: "6666"
                    protocol: "TCP"
                  - port: "6666"
                    protocol: "UDP"
          count: 1
          any: false
  
  - it: should setup egress to otel with https custom port FQDN endpoint
    set:
      otel.endpoint: https://10.100.1.1:5053
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "10.100.1.1"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "10.100.1.1"
            toPorts:
              - ports:
                  - port: "5053"
                    protocol: "TCP"
                  - port: "5053"
                    protocol: "UDP"
          count: 1
          any: false