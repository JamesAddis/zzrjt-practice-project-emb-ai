          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "172.16.20.20"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "172.16.20.20"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
          count: 1
