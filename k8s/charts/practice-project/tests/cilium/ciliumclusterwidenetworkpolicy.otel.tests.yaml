suite: test Host firewall CiliumClusterwideNetworkpolicy includes external OTEL services
templates:
  - templates/_helper.tpl
  - templates/ciliumclusterwidenetworkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set:
  cilium.enabled: true
  otel.enabled: true
  cilium.hostPolicy.enabled: true
  cilium.hostPolicy.otel: true
tests:
  - it: should setup egress to otel FQDN endpoint 
    set:
      otel.endpoint: test.otel.lan
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
          count: 1
          any: false

  - it: should setup egress to otel http FQDN endpoint 
    set:
      otel.endpoint: http://test.otel.example.internal
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.example.internal"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.example.internal"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
          count: 1
          any: false
  
  - it: should setup egress to otel https FQDN endpoint
    set:
      otel.endpoint: https://different.test.example.com
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "different.test.example.com"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "different.test.example.com"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
          count: 1
          any: false
  
  - it: should setup egress to otel with custom port FQDN endpoint (test.otel.example.internal)
    set:
      otel.endpoint: extra-fine.lan:6666
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "extra-fine.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "extra-fine.lan"
            toPorts:
              - ports:
                  - port: "6666"
                    protocol: "TCP"
                  - port: "6666"
                    protocol: "UDP"
          count: 1
          any: false
  
  - it: should setup egress to otel with https custom port FQDN endpoint (test.otel.example.internal)
    set:
      otel.endpoint: https://completely-different.lan:5053
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "completely-different.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "completely-different.lan"
            toPorts:
              - ports:
                  - port: "5053"
                    protocol: "TCP"
                  - port: "5053"
                    protocol: "UDP"
          count: 1
          any: false

  - it: should setup egress to otel CIDR endpoint
    set:
      otel.endpoint: 10.2.2.50
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "10.2.2.50"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toCIDRs:
              - "10.2.2.50"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
