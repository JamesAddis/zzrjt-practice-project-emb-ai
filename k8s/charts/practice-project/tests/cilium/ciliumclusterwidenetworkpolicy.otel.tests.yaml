suite: test Host firewall CiliumClusterwideNetworkpolicy includes external OTEL services
templates:
  - templates/_helper.tpl
  - templates/ciliumclusterwidenetworkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set:
  cilium.enabled: true
  cilium.hostPolicy.enabled: true
  cilium.hostPolicy.otel: true
  cilium.hostPolicy.egressSelector: 
    - matchExpressions:
        - operator: In
          key: names
          values:
            - eqweq
            - e232
tests:
  - it: should setup egress to otel FQDN endpoint 
    set:
      otel.endpoint: test.otel.lan
      cilium.hostPolicy.egressSelector:
        - matchLabels:
            test: test
        - matchExpressions:
            - operator: Exists
              key: Test
    asserts:
      - isKind:
          of: CiliumClusterwideNetworkPolicy
      - isNotNull:
          path: specs
      - contains:
          path: specs
          content:
            description: "Host egress to external OTEL Endpoint"
            nodeselector:
              matchLabels:
                test: test
          count: 1
          any: true
      - contains:
          path: specs
          content:
            description: "Host egress to external OTEL Endpoint"
            nodeselector:
              matchExpressions:
              - operator: Exists
                key: Test
                any: true
          count: 1
          any: true
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
          count: 2
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
          count: 2
          any: false

  - it: should setup egress to otel FQDN endpoint with prefix
    set:
      otel.endpoint: test.otel.lan/openai
      cilium.hostPolicy.egressSelector:
        - matchLabels:
            e2e: e1
    asserts:
      - isKind:
          of: CiliumClusterwideNetworkPolicy
      - isNotNull:
          path: specs
      - contains:
          path: specs
          content:
            description: "Host egress to external OTEL Endpoint"
            nodeselector:
              matchLabels:
                e2e: e1
          count: 1
          any: true
      - isSome:
          path: specs[*].egress
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
          count: 1
          any: true
      - contains:
          path: specs[*].egress
          content:
            toFQDNs:
              - matchName: "test.otel.lan"
            toPorts:
              - ports:
                  - port: "80"
                    protocol: "TCP"
                  - port: "80"
                    protocol: "UDP"
                  - port: "443"
                    protocol: "TCP"
                  - port: "443"
                    protocol: "UDP"
          count: 1
          any: false

  - it: should setup egress to otel http FQDN endpoint 
    set:
      otel.endpoint: http://test.otel.example.internal
      cilium.hostPolicy.egressSelector:
        - matchExpressions:
            - operator: In
