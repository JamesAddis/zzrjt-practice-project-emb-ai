suite: test Pod firewall CiliumNetworkpolicy includes ingress for knative
templates:
  - templates/_helper.tpl
  - templates/ciliumnetworkpolicy.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set: 
  http3: true
  cilium.enabled: true
  knative.enabled: true
  cilium.networkPolicy.enabled: true
  cilium.networkPolicy.knative.enabled: true
tests:
  - it: should not setup knative ingress if not enabled
    set:
      http3: false
      knative.enabled: false
      cilium.networkPolicy.knative.selectors:
        - matchLabels:
            eq: ti
            e2: rqwe
        - matchExpressions:
            - key: val
              operator: In
              values:
               - least
               - i
               - could
               - do
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs
      - notContains:
          path: specs
          content:
            description: Allow Pod ingress for Knative
          any: true
      - notContains:
          path: specs[*].ingress
          content:
            fromEndpoints:
              - matchLabels:
                  eq: ti
                  e2: rqwe
              - matchExpressions:
                  - key: val
                    operator: In
                    values:
                    - least
                    - i
                    - could
                    - do
            toPorts:
              - ports:
                  - port: "http"
                    protocol: TCP
                  - port: "http3"
                    protocol: UDP
                rules:
                  http: [{}]
          count: 1
          any: false
      - notContains:
          path: specs[*].ingress
          content:
            fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: knative
            toPorts:
              - ports:
                  - port: "http"
                    protocol: TCP
                  - port: "http3"
                    protocol: UDP
                rules:
                  http: [{}]
          count: 1
          any: false
    
  - it: should not setup knative ingress if not enabled for firewall
    set:
      http3: false
      cilium.networkPolicy.knative.enabled: false
      cilium.networkPolicy.knative.selectors:
        - matchLabels:
            eq: ti
            e2: rqwe
        - matchExpressions:
            - key: val
              operator: In
              values:
               - least
               - i
               - could
               - do
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs
      - notContains:
          path: specs
          content:
            description: Allow Pod ingress for Knative
          any: true
      - notContains:
          path: specs[*].ingress
          content:
            fromEndpoints:
              - matchLabels:
                  eq: ti
                  e2: rqwe
              - matchExpressions:
                  - key: val
                    operator: In
                    values:
                    - least
                    - i
                    - could
                    - do
            toPorts:
              - ports:
                  - port: "http"
                    protocol: TCP
                rules:
                  http: [{}]
          count: 1
          any: false

  - it: should setup ingress for Knative handler with default selector if no selectors set
    set:
      cilium.networkPolicy.knative.selectors: []
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs
      - contains:
          path: specs
          content:
            description: Allow Pod ingress for Knative
          count: 1
          any: true
      - contains:
          path: specs[*].ingress
          content:
            fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: knative
            toPorts:
              - ports:
                  - port: "http"
                    protocol: TCP
                  - port: "http3"
                    protocol: UDP
                rules:
                  http: [{}]
          count: 1
          any: false

  - it: should setup ingress for Knative with custom selectors
    set:
      cilium.networkPolicy.knative.selectors:
        - matchLabels:
            test: test
        - matchExpressions:
            - key: tester
              operator: Exists
      knative.hostnames:
        - practice-project.example.internal
    asserts:
      - isKind:
          of: CiliumNetworkPolicy
      - isNotNull:
          path: specs
      - isSome:
          path: specs
      - contains:
          path: specs
          content:
            description: Allow Pod ingress for Knative
          count: 1
          any: true
      - contains:
          path: specs[*].ingress
          content:
            fromEndpoints:
              - matchLabels:
                  test: test
              - matchExpressions:
                  - key: tester
                    operator: Exists
            toPorts:
              - ports:
                  - port: "http"
                    protocol: TCP
                  - port: "http3"
                    protocol: UDP
                rules:
                  http: [{}]
          count: 1
          any: false
  