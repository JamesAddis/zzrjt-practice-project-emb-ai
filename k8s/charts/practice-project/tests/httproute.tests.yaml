suite: test HTTPRoute setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/httproute.yaml
tests:
  - it: should render httproute
    set:
      service.port: 8443
      keda.service: "custom-keda-service"
      keda.namespace: "keda-alt"
      keda.port: 9090
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: HTTPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1
  - it: should setup correct metadata
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
  - it: should setup correct metadata name
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release
  - it: should setup correct metadata alt labels
    release:
      name: app-val
      namespace: testat-ada2
      revision: 5
      upgrade: true
    chart:
      version: 2.4.1
      appVersion: 14.6.10
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            helm.sh/chart: "practice-project-2.4.1"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "14.6.10"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: app-val
  - it: should use httproute service
    set:
      service.port: 8443
      keda.service: "custom-keda-service"
      keda.namespace: "keda-alt"
      keda.port: 9090
    asserts:
      - notContains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "my-release"
                  port: 8443
                  weight: 1
          any: true
      - notContains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "keda-add-ons-http-interceptor-proxy"
                  namespace: "keda"
                  port: 8080
                  weight: 1
          any: true
      - contains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "custom-keda-service"
                  namespace: "keda-alt"
                  port: 9090
                  weight: 1
          any: true
  - it: should use httproute service with filters
    set:
      service.port: 5656
      keda.service: ""
      keda.namespace: ""
      keda.port: ""
    asserts:
      - notContains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "my-release"
                  port: 5656
                  weight: 1
          any: true
      - contains:
          path: spec.rules
          content:
            - backendRefs:
                - name: "keda-add-ons-http-interceptor-proxy"
                  namespace: "keda"
                  port: 8080
                  weight: 1
          any: true