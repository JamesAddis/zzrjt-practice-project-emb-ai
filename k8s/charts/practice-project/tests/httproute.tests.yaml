suite: test httproute setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/httproute.yaml
tests:
  - it: should use standard service for httproute if KEDA/Knative not enabled
    set:
      httpRoute.enabled: true
      autoscaling.enabled: true
      knative.enabled: false
      keda.enabled: false
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:tester
  - it: should use standard service for httproute if autoscaling not enabled
    set:
      autoscaling.enabled: false
      knative.enabled: true
      keda.enabled: true
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:tester
  - it: should render correct metadata
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HTTPRoute
  - it: should render correct hostnames
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HTTPRoute
  - it: should render correct parentsRefs
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HTTPRoute
  - it: should render correct rules
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HTTPRoute