suite: test service setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/service.yaml
tests:
  - it: should render service
    asserts:
      - isKind:
          of: Service
  - it: should render correct metadata labels
    asserts:
      - isKind:
          of: Service
  - it: should render correct fullname
    set:
      fullName: "aseqweqweqwe"
    asserts:
      - isKind:
          of: Service
  - it: should render correct partial name
    set:
      fullName: "testmytester"
    asserts:
      - isKind:
          of: Service
  - it: should render correct override name
    set:
      serviceAccount.fullName: "testmytester"
    asserts:
      - isKind:
          of: Service
  - it: should render correct ports
    set:
      serviceaccount.automount: true
    asserts:
      - isKind:
          of: Service
  - it: should render correct ports (alt)
    set:
      serviceaccount.automount: false
    asserts:
      - isKind:
          of: Service