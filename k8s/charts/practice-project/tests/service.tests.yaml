suite: test service setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set:
  knative.enabled: false
templates:
  - templates/_helpers.tpl
  - templates/service.yaml
tests:
  - it: should render service
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: Service
      - isAPIVersion:
          of: v1
  - it: should setup correct metadata
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
  - it: should setup correct metadata labels
    asserts:
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release
  - it: should setup correct selectors with alt data
    release:
      name: app-val
      namespace: testat-ada2
      revision: 5
      upgrade: true
    chart:
      version: 2.4.1
      appVersion: 14.6.10
    asserts:
      - equal:
          path: spec.selectors
          value:
            helm.sh/chart: "practice-project-2.4.1"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "14.6.10"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: app-val