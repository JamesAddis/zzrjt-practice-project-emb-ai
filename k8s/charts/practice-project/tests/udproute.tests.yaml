suite: test udproute setup
templates:
  - templates/_helpers.tpl
  - udproute.yaml
tests:
  - it: should render udproute
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: UDPRoute
      - isAPIVersion:
          of: gateway.networking.k8s.io/v1

  - it: should setup correct metadata
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release
  - it: should setup correct metadata alt release/data
    set:
      podLabels:
        dah: daweq
    release:
      name: app-val
      namespace: testat-ada2
      revision: 5
      upgrade: true
    chart:
      version: 2.4.1
      appVersion: 14.6.10
    asserts:
      - equal:
          path: metadata.name
          value: "testat-ada2-app-val"
      - equal:
          path: spec.selector.matchLabels
          value:
            helm.sh/chart: "practice-project-2.4.1"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "14.6.10"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: app-val
  - it: should setup correct selectors
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release