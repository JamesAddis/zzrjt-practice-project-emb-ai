suite: test httproute knative setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/httproute.yaml
set:
  httpRoute.enabled: true
  autoscaling.enabled: true
  knative.enabled: true
  keda.enabled: false
tests:
  - it: should use knative service instead of standard service for httproute if knative enabled
    asserts:
      - isKind:
          of: HTTPRoute
      
  - it: should use custom knative url if set and knative enabled
    set:
      image.tag: tester
      image.digest: ""
    asserts:
      - isKind:
          of: HTTPRoute
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:tester