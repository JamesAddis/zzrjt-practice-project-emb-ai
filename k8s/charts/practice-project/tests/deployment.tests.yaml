suite: test deployment
templates:
  - templates/_helper.tpl
  - templates/deployment.yaml
tests:
  - it: should render deployment
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
  - it: should setup correct metadata name
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
  - it: should setup correct metadata labels
    asserts:
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release
  - it: should use tag when digest not set
    set:
      image.repository: ter/testeq
      image.tag: tester
      image.digest: ""
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:tester
  - it: should use digest
    set:
      image.tag: tester
      image.digest: sha256:e2fd96aab9f74037ccbf7200f9512b02a999d47331acb8a23aee034a7abc4c3b
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx@sha256:e2fd96aab9f74037ccbf7200f9512b02a999d47331acb8a23aee034a7abc4c3b
  - it: should add apparmor profile set to use
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should add apparmor profile set to create apparmor
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should add seccomp profile set to use
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should add seccomp profile set to create
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should set filesystem as readonly if hardened
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should create empty dirs for for /var/logs, tmp, and /var/lib
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
  - it: should create /etc/practice-project as projected volume with read only options
    set:
      image.tag: latest
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: -my-chart$
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest