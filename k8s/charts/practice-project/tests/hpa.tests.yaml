suite: test HPA
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
set:
  autoscaling.enabled: true
  keda.enabled: false
  knative.enabled: false
templates:
  - templates/_helpers.tpl
  - templates/hpa.yaml
tests:
  - it: should not render if autoscaling disabled
    set:
      autoscaling.enabled: false
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0
  - it: should render HPA
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
  - it: should setup correct metadata name
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
  - it: should setup correct metadata labels
    asserts:
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release
  - it: should render correct min replicas
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
  - it: should render correct max replicas
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
  - it: should render correct scaling metrics
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2