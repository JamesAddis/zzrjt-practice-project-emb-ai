suite: test HPA
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/hpa.yaml
tests:
  - it: should not render if autoscaling disabled
    set:
      autoscaling.enabled: false
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
  - it: should not render if autoscaling enabled and KEDA enabled
    set:
      autoscaling.enabled: true
      keda.enabled: true
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
  - it: should not render if autoscaling enabled and Knative enabled
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: true
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
  - it: should render if autoscaling enabled and KEDA/Knative disabled
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
  - it: should render correct metadata
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
  - it: should render correct min replicas
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
  - it: should render correct max replicas
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
  - it: should render correct scaling metrics
    set:
      autoscaling.enabled: true
      keda.enabled: false
      knative.enabled: false
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler