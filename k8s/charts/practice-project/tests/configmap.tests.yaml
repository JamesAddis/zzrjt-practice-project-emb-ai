suite: test ConfigMap adds setting for python app correctly
templates:
  - templates/_helper.tpl
  - templates/configmap.yaml
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
tests:
  - it: should render configmap
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1
  - it: should setup correct metadata name
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
  - it: should setup correct metadata labels
    asserts:
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release