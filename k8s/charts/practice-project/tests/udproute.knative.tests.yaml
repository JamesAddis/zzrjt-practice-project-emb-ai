suite: test UDPRoute knative setup
templates: 
  - templates/_helpers.tpl
  - udproute.yaml
tests:
  - it: should not render if Knative enabled
    set:
      udproute.enabled: true
      keda.enabled: false
      knative.enabled: true
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0