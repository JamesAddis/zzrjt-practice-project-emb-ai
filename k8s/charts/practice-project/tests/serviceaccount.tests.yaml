suite: test service account setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/serviceaccount.yaml
set:
  serviceAccount.create: true
tests:
  - it: should not render if not set to create
    set:
      serviceAccount.create: false
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render if set to create
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render correct metadata labels
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render correct metadata annotations
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render correct fullname
    set:
      fullName: "aseqweqweqwe"
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render correct partial name
    set:
      fullName: "testmytester"
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render correct override name
    set:
      serviceAccount.name: "eqweqwe"
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render automount
    set:
      serviceaccount.automount: true
    asserts:
      - isKind:
          of: ServiceAccount
  - it: should render automount as false
    set:
      serviceaccount.automount: false
    asserts:
      - isKind:
          of: ServiceAccount