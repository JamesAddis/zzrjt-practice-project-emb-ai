suite: test service account setup
includeCrds: true
values:
  - values.yaml
release:
  name: my-release
  namespace: my-namespace
  revision: 1
  upgrade: true
chart:
  version: 1.0.0
  appVersion: 1.0.0
templates:
  - templates/_helpers.tpl
  - templates/serviceaccount.yaml
set:
  serviceAccount.create: true
tests:
  - it: should not render if not set to create
    set:
      serviceAccount.create: false
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0
  - it: should render automount
    set:
      serviceaccount.automount: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
  - it: should render automount as false
    set:
      serviceaccount.automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false
  - it: should render if set to create
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - isAPIVersion:
          of: v1
  - it: should render correct metadata name
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
  - it: should render correct metadata labels
    asserts:
      - equal:
          path: metadata.name
          value: "my-namespace-my-release"
      - equal:
          path: metadata.labels
          value:
            helm.sh/chart: "practice-project-1.0.0"
            app.kubernetes.io/name: practice-project
            app.kubernetes.io/version: "1.0.0"
            app.kubernetes.io/managed-by: helm
            app.kubernetes.io/instance: my-release
  - it: should render correct metadata annotations
    asserts:
      - equal:
          path: metadata.annotations
          value:
  - it: should render correct fullname
    set:
      fullName: "aseqweqweqwe"
    asserts:
      - equal:
          path: metadata.name
          value: "aseqweqweqwe"
  - it: should render correct partial name
    set:
      fullName: "teqqweqw"
    asserts:
      - equal:
          path: metadata.name
          value: "teqqweqw"
  - it: should render correct override service account name
    set:
      serviceAccount.name: "eqweqwe"
    asserts:
      - equal:
          path: metadata.name
          value: "eqweqwe"