<html>
<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="./static/mywebscript.js"></script>
    <style>
        .center-heading {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <h1 class="center-heading">NLP - Sentiment Analysis using BERT</h1> 
            <div style="padding: 25px 25px 25px 25px;"></div>
            <form method="POST" action="/">
                <h2 class="mb-3">
                    <label for="textToAnalyze" class="form-label">Please enter the text to be analyzed</label>
                    <input type="textarea" required name="textToAnalyze" class="form-control" id="textToAnalyze" value="{{text_to_analyze}}" />
                </h2>

                <div style="padding: 25px 25px 25px 25px;">
                    <button class="btn btn-secondary">Run Sentiment Analysis</button>
                </div>
            <form>
            <div style="padding: 25px 25px 25px 25px;"></div>
            <h2 class="mb-3">
                <label for="system_response" class="form-label">Result of Sentiment Analysis</label>
            </h2>
            <div id="system_response"{% if is_error %}class="text-danger"{% endif %} style="padding: 25px 25px 25px 25px;">{{sentiment_analysis_result}}</div>
        </div>
    </div>
</body>
